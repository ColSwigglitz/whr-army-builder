name: Endless Banner visibility smoke test

on:
  pull_request:
    branches: [main]

jobs:
  test-banner-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: node --check common_magic_item_effects.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Test visibility and discount
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle'});
            await page.locator('[data-army-id="empire"]').click();
            await page.waitForTimeout(400);

            const result = await page.evaluate(() => {
              const unit = state.data.faction.regiments.find(u => u.magicBanner?.allowed);
              if (!unit) throw new Error('No banner-capable regiment found');
              const entry = createEntry('regiments', unit);
              entry.command.standardBearer = true;
              state.draft = entry;
              const html = renderMagicBannerEditor(entry, unit);
              const visibleAtDefault = html.includes('endless_banner') && html.includes('Endless Banner');

              entry.size = 40;
              const before = calculateEntry(entry);
              entry.magicBanner = 'endless_banner';
              state.pointsLimit = 2000;
              const after = calculateEntry(entry);
              const expected = before - Math.min(before * 0.20, 50);
              return { unit: unit.name, defaultSize: createEntry('regiments', unit).size, visibleAtDefault, before, after, expected };
            });

            console.log(JSON.stringify(result));
            if (!result.visibleAtDefault) throw new Error('Endless Banner is not visible at default regiment size');
            if (Math.abs(result.after - result.expected) > 0.0001) throw new Error('Endless Banner discount incorrect');
            if (errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
