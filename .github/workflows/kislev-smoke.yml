name: Kislev smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-kislev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and payload
        run: |
          node --check kislev_loader.js
          node --check kislev_extensions.js
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_kislev_v0_1.payload','utf8').trim(),'base64')));
          console.log('KISLEV COUNTS', d.faction.characters.length, d.faction.regiments.length, d.faction.warMachines.length, d.faction.specialCharacters.length, d.factionMagicItems.length);
          if(d.faction.characters.length!==8 || d.faction.regiments.length!==11 || d.faction.warMachines.length!==2 || d.faction.specialCharacters.length!==9 || d.factionMagicItems.length!==12) process.exit(1);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('dialog',async d=>d.dismiss());
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.locator('[data-army-id="kislev"]').click();
            await page.waitForTimeout(1000);

            const result=await page.evaluate(()=>{
              const f=state.data.faction;
              const find=(section,name)=>f[section].find(u=>u.name===name);
              const make=(section,name,size)=>{const u=find(section,name);if(!u)throw new Error(`Missing ${section}: ${name}`);const e=createEntry(section,u);if(size!=null)e.size=size;return[u,e]};
              const mountCost=(section,name,mount)=>{const [,e]=make(section,name);e.mount=mount;return calculateEntry(e)};
              const costs={};
              for(const [name,key] of [['Boyar','boyar'],['Battle Standard Bearer','bsb'],['Hetman','hetman'],['Priest of Ursun','priest']]){const[,e]=make('characters',name);costs[key]=calculateEntry(e)}
              Object.assign(costs,{boyarHorse:mountCost('characters','Boyar','warhorse'),boyarBear:mountCost('characters','Boyar','great_bear'),bsbHorse:mountCost('characters','Battle Standard Bearer','warhorse'),bsbBear:mountCost('characters','Battle Standard Bearer','great_bear'),hetmanHorse:mountCost('characters','Hetman','warhorse'),hetmanBear:mountCost('characters','Hetman','great_bear'),priestHorse:mountCost('characters','Priest of Ursun','warhorse'),priestBear:mountCost('characters','Priest of Ursun','great_bear')});
              const witches=['Ice Witch Lady (Level 4)','Ice Witch Mistress (Level 3)','Ice Witch Champion (Level 2)','Ice Witch (Level 1)'].map(n=>make('characters',n));costs.witches=witches.map(([,e])=>calculateEntry(e));costs.witchLadyBear=mountCost('characters','Ice Witch Lady (Level 4)','great_bear');
              for(const [name,size] of [['Gryphon Legion',5],['Brotherhood of the Bear',5],['Sons of Ursa',3],['Kislev Kossars',10],['Hand Gunners',10],['Hunters',5],['Guards',5],['Road Wardens',5],['Kislev Horse Archers',5],['Kislev Winged Lancers',5]]){const[,e]=make('regiments',name,size);costs[name]=calculateEntry(e)}
              const [,wing]=make('regiments','Kislev Winged Lancers',5);wing.optionSelections.shrieking_back_banners=true;costs.wingedShriek=calculateEntry(wing);
              const [pack,packE]=make('regiments','Beasts and Beastmasters');costs.pack=calculateEntry(packE);const packW=createEntry('regiments',pack);packW.optionSelections.beastmasters=2;packW.optionSelections.beastType='wolves';packW.optionSelections.beasts=4;costs.packWolves=calculateEntry(packW);
              const [mortar,mortarE]=make('warMachines','Mortar'),[,uruganE]=make('warMachines','Urugan Cannon');const mortar5=createEntry('warMachines',mortar);mortar5.optionSelections.extra_crew=2;costs.mortar=calculateEntry(mortarE);costs.mortar5=calculateEntry(mortar5);costs.urugan=calculateEntry(uruganE);

              const [igor,igorE]=make('specialCharacters','Igor the Terrible'),[miska,miskaE]=make('specialCharacters','Miska the Slaughterer'),[,iljaE]=make('specialCharacters','Ilja of Murova');
              const specials={igorBase:calculateEntry(igorE),igorMount:igorE.mount,igorOptions:(igor.mountOptions||[]).map(x=>[x.mountId,x.cost]),igorBear:mountCost('specialCharacters','Igor the Terrible','great_bear'),igorSpider:mountCost('specialCharacters','Igor the Terrible','monstrous_spider'),igorWyvern:mountCost('specialCharacters','Igor the Terrible','wyvern'),igorGriffon:mountCost('specialCharacters','Igor the Terrible','griffon'),igorManticore:mountCost('specialCharacters','Igor the Terrible','manticore'),igorChimera:mountCost('specialCharacters','Igor the Terrible','chimera'),miskaBase:calculateEntry(miskaE),miskaMount:miskaE.mount,miskaOptions:(miska.mountOptions||[]).map(x=>[x.mountId,x.cost]),miskaBear:mountCost('specialCharacters','Miska the Slaughterer','great_bear')};
              const boyar=find('characters','Boyar'),lady=witches[0][0];state.roster=[];const normalBoyarItems=getAllowedMagicItems(boyar,'character'),ladyItems=getAllowedMagicItems(lady,'character');state.roster=[iljaE];const boyarAfterIlja=getAllowedMagicItems(boyar,'character');state.roster=[];
              const wyvern=profileById.get('wyvern'),chimera=profileById.get('chimera'),wyvernMount=mountById.get('wyvern'),chimeraMount=mountById.get('chimera');
              return {name:f.name,counts:[f.characters.length,f.regiments.length,f.warMachines.length,f.specialCharacters.length,state.data.factionMagicItems.length],costs,specials,magic:{boyarIce:normalBoyarItems.some(i=>i.id==='ice_armour'),ladyIce:ladyItems.some(i=>i.id==='ice_armour'),wyrmBefore:normalBoyarItems.some(i=>i.id==='wyrmslayer_sword'),wyrmAfter:boyarAfterIlja.some(i=>i.id==='wyrmslayer_sword')},monsters:{wyvern:wyvern?.stats,chimera:chimera?.stats,wyvernRules:wyvernMount?.rules||[],chimeraRules:chimeraMount?.rules||[]},pad:{pack:rosterPadRow(packW).includes('Giant Wolf'),mortar:rosterPadRow(mortar5).includes('Crew')},ids:{gryphon:find('regiments','Gryphon Legion').id,brotherhood:find('regiments','Brotherhood of the Bear').id,sons:find('regiments','Sons of Ursa').id,pack:pack.id,bsb:find('characters','Battle Standard Bearer').id,radinov:find('specialCharacters','Prince Ivan Radinov, Captain of the Gryphon Legion').id,katarin:find('specialCharacters','Tzarina Katarin the Ice Queen').id,boris:find('specialCharacters','Boris Ursus, The Red Tzar').id}};
            });
            console.log('KISLEV',JSON.stringify(result));
            if(result.name!=='Kislev'||JSON.stringify(result.counts)!=='[8,11,2,9,12]')throw new Error(`Load/count regression ${JSON.stringify(result.counts)}`);
            const ex={boyar:100,boyarHorse:120,boyarBear:145,bsb:80,bsbHorse:90,bsbBear:115,hetman:60,hetmanHorse:75,hetmanBear:100,priest:65,priestHorse:115,priestBear:140,'Gryphon Legion':125,'Brotherhood of the Bear':90,'Sons of Ursa':150,'Kislev Kossars':90,'Hand Gunners':100,Hunters:55,Guards:50,'Road Wardens':85,'Kislev Horse Archers':50,'Kislev Winged Lancers':85,wingedShriek:100,pack:57,packWolves:64,mortar:80,mortar5:90,urugan:80};
            for(const[k,v]of Object.entries(ex))if(result.costs[k]!==v)throw new Error(`${k} expected ${v}, got ${result.costs[k]}`);
            if(JSON.stringify(result.costs.witches)!=='[240,170,110,50]'||result.costs.witchLadyBear!==270)throw new Error(`Ice Witch pricing ${JSON.stringify(result.costs.witches)} / ${result.costs.witchLadyBear}`);
            const s=result.specials;if(s.igorBase!==120||s.igorMount!=='warhorse'||s.igorBear!==165||s.igorSpider!==175||s.igorWyvern!==275||s.igorGriffon!==295||s.igorManticore!==335||s.igorChimera!==385||s.miskaBase!==250||s.miskaMount!=='warhorse'||s.miskaBear!==280)throw new Error(`Special mount pricing ${JSON.stringify(s)}`);
            if(!s.igorOptions.some(x=>x[0]==='warhorse'&&x[1]===0)||!s.miskaOptions.some(x=>x[0]==='warhorse'&&x[1]===0))throw new Error('Included Warhorse missing');
            if(result.magic.boyarIce||!result.magic.ladyIce||!result.magic.wyrmBefore||result.magic.wyrmAfter)throw new Error(`Magic restriction regression ${JSON.stringify(result.magic)}`);
            const wy=result.monsters.wyvern;if(JSON.stringify(wy)!==JSON.stringify({M:6,WS:5,BS:0,S:5,T:6,W:4,I:4,A:3,Ld:5})||!result.monsters.wyvernRules.join(' ').includes('4+ armour')||!result.monsters.chimeraRules.join(' ').includes('Strength 4 flaming breath'))throw new Error(`Monster source regression ${JSON.stringify(result.monsters)}`);
            if(!result.pad.pack||!result.pad.mortar)throw new Error(`Roster Pad regression ${JSON.stringify(result.pad)}`);
            const construction=await page.evaluate(ids=>{const count=id=>state.roster.filter(e=>e.unitId===id).length;const one=(section,id)=>{state.roster=[];addUnit(section,id);addUnit(section,id);return count(id)===1};const out={gryphon:one('regiments',ids.gryphon),brotherhood:one('regiments',ids.brotherhood),sons:one('regiments',ids.sons),pack:one('regiments',ids.pack),bsb:one('characters',ids.bsb)};state.roster=[];addUnit('specialCharacters',ids.radinov);out.radinovBlocked=state.roster.length===0;state.roster=[];addUnit('regiments',ids.gryphon);addUnit('specialCharacters',ids.radinov);out.radinovAllowed=count(ids.radinov)===1;state.roster=[];addUnit('specialCharacters',ids.katarin);addUnit('specialCharacters',ids.boris);out.triad=count(ids.katarin)===1&&count(ids.boris)===0;return out},result.ids);
            console.log('CONSTRUCTION',JSON.stringify(construction));if(Object.values(construction).some(v=>!v))throw new Error(`Construction regression ${JSON.stringify(construction)}`);
            if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
