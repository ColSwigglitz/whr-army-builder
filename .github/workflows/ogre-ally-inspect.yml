name: Ogre ally source inspect
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Ogre payload options
        run: |
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_ogre_mercenaries_v0_1.payload','utf8').trim(),'base64')));
          for(const u of [...d.faction.characters,...d.faction.regiments,...d.faction.warMachines]) console.log(u.id,JSON.stringify({points:u.points,options:u.options,equipmentOptions:u.equipmentOptions,mountOptions:u.mountOptions,champion:u.champion}));
          JS
