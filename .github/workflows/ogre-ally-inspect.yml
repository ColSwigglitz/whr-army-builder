name: Ogre ally source inspect
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Goblin magic schema
        run: |
          node - <<'JS'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/whr_orcs_goblins_v0_1.json','utf8'));
          console.log('ITEMS',d.factionMagicItems?.length,d.factionMagicItems?.slice(0,5));
          for(const u of d.faction.characters.filter(u=>/goblin/i.test(u.name)))console.log('CHAR',JSON.stringify(u));
          JS
