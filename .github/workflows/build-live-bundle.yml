name: Build LIVE JavaScript bundles

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-bundle-main
  cancel-in-progress: false

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build bundles
        run: python tools/build_dev_bundle.py

      - name: Validate JavaScript syntax
        run: |
          node --check dev_startup_bundle.js
          node --check dev_army_bundle.js
          node --check dev_account_bundle.js
          node --check dev_campaign_bundle.js

      - name: Commit generated bundles
        run: |
          FILES="index.html dev_startup_bundle.js dev_army_bundle.js dev_account_bundle.js dev_campaign_bundle.js"
          if git diff --quiet -- $FILES && [ -f dev_startup_bundle.js ] && [ -f dev_army_bundle.js ] && [ -f dev_account_bundle.js ] && [ -f dev_campaign_bundle.js ]; then
            echo "Bundles already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Build LIVE JavaScript bundles [bundle]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
