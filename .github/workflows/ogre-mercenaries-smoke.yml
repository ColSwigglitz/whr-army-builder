name: Ogre Mercenaries smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-ogres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and payload
        run: |
          node --check ogre_mercenaries_loader.js
          node --check ogre_mercenaries_extensions.js
          node --check ogre_mercenaries_final_fixes.js
          node --check ogre_mercenaries_guard.js
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_ogre_mercenaries_v0_1.payload','utf8').trim(),'base64')));
          if(d.faction.characters.length!==5||d.faction.regiments.length!==4||d.faction.warMachines.length!==2||d.faction.specialCharacters.length!==0||d.factionMagicItems.length!==3)process.exit(1);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('dialog',async d=>d.dismiss());
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});await page.locator('[data-army-id="ogre_mercenaries"]').click();await page.waitForTimeout(1000);
            const result=await page.evaluate(()=>{
              const f=state.data.faction,find=(s,id)=>f[s].find(u=>u.id===id),mk=(s,id,n)=>{const u=find(s,id),e=createEntry(s,u);if(n)e.size=n;return[u,e]};
              const [lord,lordE]=mk('characters','ogre_lord'),[hero,heroE]=mk('characters','ogre_hero'),[bsb,bsbE]=mk('characters','ogre_bsb'),[shaman,shamanE]=mk('characters','ogre_shaman'),[sc,scE]=mk('characters','ogre_shaman_champion');
              const [pack,packE]=mk('regiments','ogre_beastmaster_pack'),pack2=createEntry('regiments',pack);pack2.optionSelections.beastmasters=2;pack2.optionSelections.sabretooths=3;
              const [ogres,o]=mk('regiments','ogres',3),oh=createEntry('regiments',ogres),oa=createEntry('regiments',ogres),od=createEntry('regiments',ogres);[oh,oa,od].forEach(e=>e.size=3);oh.optionSelections.armour_upgrade='heavy_armour';oa.optionSelections.weapon_upgrade='additional_hand_weapon';od.optionSelections.weapon_upgrade='double_handed_weapon';
              const [mane,m]=mk('regiments','ogre_maneaters',3),ma=createEntry('regiments',mane);ma.size=3;ma.optionSelections.weapon_upgrade='all_three_weapons';
              const [lead,l]=mk('regiments','ogre_leadbelchers',3),lh=createEntry('regiments',lead);lh.size=3;lh.optionSelections.armour='heavy_armour';
              const [giant,g]=mk('warMachines','giant_cyclops'),cy=createEntry('warMachines',giant);cy.optionSelections.cyclops=true;const [rhino,r]=mk('warMachines','rhino_rider'),ru=createEntry('warMachines',rhino);ru.optionSelections.extra_tusks_horns=true;
              const hunters=find('regiments','ogre_ally_night_goblin_squig_hunters'),he=createEntry('regiments',hunters),night=find('regiments','ogre_ally_night_goblin_infantry'),ne=createEntry('regiments',night);ne.size=20;ne.optionSelections.fanatics=2;ne.optionSelections.mad_cap_mushroom=true;
              const nativeItems=getAllowedMagicItems(lord,'character'),shamanItems=getAllowedMagicItems(shaman,'character');
              const allyMagic={};for(const t of ['common_goblins','hobgoblins','halflings']){const u=f.characters.find(x=>x.ogreAllyTribe===t);state.draft=createEntry('characters',u);allyMagic[t]=getAllowedMagicItems(u,'character').map(i=>({id:i.id,src:i.ogreAllySource||'',cat:i.category}));}state.draft=null;
              const tribes={};for(const t of ['common_goblins','forest_goblins','night_goblins','hobgoblins','halflings'])tribes[t]=f.regiments.filter(u=>u.ogreAllyTribe===t).map(u=>u.name);
              state.armyOptions.ogreAllyTribe='night_goblins';const snap=makeRosterSnapshot();
              return {counts:[f.characters.filter(u=>!(u.tags||[]).includes('ogre_ally')).length,f.regiments.filter(u=>!(u.tags||[]).includes('ogre_ally')).length,f.warMachines.filter(u=>!(u.tags||[]).includes('ogre_ally')).length],costs:{lord:calculateEntry(lordE),hero:calculateEntry(heroE),bsb:calculateEntry(bsbE),shaman:calculateEntry(shamanE),sc:calculateEntry(scE),pack:calculateEntry(packE),pack2:calculateEntry(pack2),o:calculateEntry(o),oh:calculateEntry(oh),oa:calculateEntry(oa),od:calculateEntry(od),m:calculateEntry(m),ma:calculateEntry(ma),l:calculateEntry(l),lh:calculateEntry(lh),g:calculateEntry(g),cy:calculateEntry(cy),r:calculateEntry(r),ru:calculateEntry(ru),he:calculateEntry(he),ne:calculateEntry(ne)},tribes,forestBad:f.regiments.filter(u=>u.ogreAllyTribe==='forest_goblins').some(u=>JSON.stringify([u.options,u.equipmentOptions]).toLowerCase().includes('poison')||u.name.toLowerCase().includes('gargantuan')),halfBad:JSON.stringify([...f.characters,...f.regiments,...f.warMachines].filter(u=>u.ogreAllyTribe==='halflings').map(u=>u.name)).toLowerCase(),nativeMagic:['iron_boot','iron_fist','smuckle_buckle'].every(id=>nativeItems.some(i=>i.id===id))&&!nativeItems.some(i=>i.ogreAllySource),shamanFam:shamanItems.some(i=>i.category==='familiar'),allyMagic,pad:[rosterPadRow(pack2).includes('Sabretooth'),rosterPadRow(ru).includes('Rhino'),rosterPadRow(he).includes('Cave Squigs'),rosterPadRow(ne).includes('Night Goblin Fanatic')],snap:snap.armyOptions?.ogreAllyTribe};
            });
            console.log('OGRE',JSON.stringify(result));
            if(JSON.stringify(result.counts)!=='[5,4,2]')throw new Error('Native Ogre counts wrong');
            const ex={lord:244,hero:171,bsb:128,shaman:98,sc:182,pack:50,pack2:120,o:72,oh:84,oa:90,od:96,m:108,ma:138,l:108,lh:126,g:200,cy:250,r:80,ru:100,he:54,ne:130};for(const[k,v]of Object.entries(ex))if(result.costs[k]!==v)throw new Error(`${k}: expected ${v}, got ${result.costs[k]}`);
            if(!result.tribes.forest_goblins.some(n=>n.includes('Forest Goblin Infantry')))throw new Error('Forest Goblin Infantry missing');for(const n of ['Night Goblin Infantry','Squig-Hoppers','Squig-Hunters','Netters and Clubbers'])if(!result.tribes.night_goblins.some(x=>x.includes(n)))throw new Error(`Missing ${n}`);
            if(result.forestBad)throw new Error('Illegal Forest Goblin option');if(/wizard|wood elf|treeman/.test(result.halfBad))throw new Error('Illegal Halfling ally');
            if(!result.nativeMagic||result.shamanFam)throw new Error('Native Ogre magic regression');
            if(!result.allyMagic.common_goblins.some(i=>i.src==='orcs_goblins')||result.allyMagic.common_goblins.some(i=>['iron_boot','iron_fist','smuckle_buckle'].includes(i.id)))throw new Error('Common Goblin magic regression');
            if(result.allyMagic.hobgoblins.some(i=>i.src==='chaos_dwarfs'&&!i.id.startsWith('ogally_chaos_dwarfs_og_')))throw new Error('Hobgoblin magic regression');if(result.allyMagic.halflings.some(i=>i.src==='halflings_moot'))throw new Error('Halfling liberated magic leaked');
            if(result.pad.some(v=>!v)||result.snap!=='night_goblins')throw new Error('Roster pad/save regression');
            const ui=await page.evaluate(()=>{const r={};for(const t of ['common_goblins','forest_goblins','night_goblins','hobgoblins','halflings']){state.armyOptions.ogreAllyTribe=t;renderUnitBrowser();r[t]=els.unitBrowser.textContent.includes('Allied');}return r});if(Object.values(ui).some(v=>!v))throw new Error(`Ally UI regression ${JSON.stringify(ui)}`);
            const construction=await page.evaluate(()=>{const count=id=>state.roster.filter(e=>e.unitId===id).length;state.roster=[];state.armyOptions.ogreAllyTribe='';addUnit('regiments','ogre_beastmaster_pack');addUnit('regiments','ogre_beastmaster_pack');const p=count('ogre_beastmaster_pack')===1;state.roster=[];addUnit('regiments','ogre_maneaters');addUnit('regiments','ogre_maneaters');const m=count('ogre_maneaters')===1;state.roster=[];addUnit('regiments','ogre_leadbelchers');addUnit('regiments','ogre_leadbelchers');const l=count('ogre_leadbelchers')===1;state.roster=[];addUnit('characters','ogre_bsb');addUnit('characters','ogre_bsb');const b=count('ogre_bsb')===1;state.roster=[];state.armyOptions.ogreAllyTribe='common_goblins';const machine=state.data.faction.warMachines.find(u=>u.ogreAllyTribe==='common_goblins');addUnit('warMachines',machine.id);const z=state.roster.length===0;const lord=state.data.faction.characters.find(u=>u.id==='ogre_lord'),ogres=state.data.faction.regiments.find(u=>u.id==='ogres'),pack=state.data.faction.regiments.find(u=>u.id==='ogre_beastmaster_pack'),le=createEntry('characters',lord),oe=createEntry('regiments',ogres),pe=createEntry('regiments',pack);oe.size=30;state.roster=[le,oe,pe];addUnit('warMachines',machine.id);addUnit('warMachines',machine.id);return{p,m,l,b,z,one:count(machine.id)===1}});if(Object.values(construction).some(v=>!v))throw new Error(`Construction regression ${JSON.stringify(construction)}`);
            if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
