name: Undead banners smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-undead-banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check undead_magic_banners.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('dialog',async d=>{await d.dismiss()});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});

            async function inspectArmy(id){
              return await page.evaluate(async id=>{
                await selectArmy(id);
                const regiments=state.data.faction.regiments||[];
                const eligible=regiments.filter(u=>u.magicBanner?.allowed);
                const first=eligible[0];
                let genericHtml='';
                if(first){const e=createEntry('regiments',first);e.command.standardBearer=true;genericHtml=renderMagicBannerEditor(e,first);}
                const bsb=(state.data.faction.characters||[]).find(u=>(u.tags||[]).some(t=>t==='bsb'||t==='battle_standard_bearer'));
                const bsbItems=bsb?getAllowedMagicItems(bsb,'character'):[];
                const findByName=needle=>regiments.find(u=>String(u.name||'').toLowerCase().includes(needle));
                const tomb=findByName('tomb guard');
                const lightHorse=findByName('skeleton light horse');
                const skeleton=findByName('skeleton warrior');
                function htmlFor(u){if(!u)return'';const e=createEntry('regiments',u);e.command.standardBearer=true;return renderMagicBannerEditor(e,u);}
                return {
                  id,faction:state.data.faction.name,banners:state.data.factionMagicItems.filter(i=>i.category==='magic_banner').map(i=>i.id),eligible:eligible.map(u=>u.name),genericHtml,
                  tombHtml:htmlFor(tomb),horseHtml:htmlFor(lightHorse),skeletonHtml:htmlFor(skeleton),
                  bsbItems:bsbItems.map(i=>i.id)
                };
              },id);
            }

            const vc=await inspectArmy('vampire_counts');
            const tk=await inspectArmy('tomb_kings');
            const cu=await inspectArmy('classic_undead');
            console.log(JSON.stringify({vc,tk,cu}));

            for(const r of [vc,tk,cu]){
              if(r.banners.length<10) throw new Error(`${r.id}: Undead banner pool missing`);
              if(!r.eligible.length) throw new Error(`${r.id}: no banner-capable regiments`);
              if(!r.genericHtml.includes('Banner of Swift Charging')) throw new Error(`${r.id}: generic regiment banner editor missing banners`);
              if(r.bsbItems.length && !r.bsbItems.includes('banner_hidden_death')) throw new Error(`${r.id}: BSB missing Banner of Hidden Death`);
            }
            if(!tk.tombHtml.includes('Icon of Rakaph')||tk.tombHtml.includes('Banner of Binding')) throw new Error('Tomb Guard banner restrictions wrong');
            if(!tk.horseHtml.includes('Ghost Rider Banner')||!tk.horseHtml.includes('Doom Rider Banner')||!tk.horseHtml.includes('Standard of the Desert')) throw new Error('Tomb King horsemen banner restrictions wrong');
            if(!tk.skeletonHtml.includes('Banner of Binding')) throw new Error('Tomb King Skeleton Warriors missing Banner of Binding');
            if(vc.genericHtml.includes('Standard of the Desert')||cu.genericHtml.includes('Standard of the Desert')) throw new Error('Standard of the Desert leaked outside Tomb Kings');
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
