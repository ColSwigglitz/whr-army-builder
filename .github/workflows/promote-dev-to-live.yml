name: Promote DEV to LIVE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-dev-to-live
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LIVE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch DEV snapshot
        run: git clone --depth 1 https://github.com/ColSwigglitz/whr-army-builder-dev.git /tmp/whr-dev

      - name: Promote DEV files
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'CNAME' \
            /tmp/whr-dev/ ./

          # Production-only presentation: keep the tested DEV application code,
          # but remove the yellow development warning and development wording.
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('WHR Army Builder — Development Build', 'WHR Army Builder')
          s = s.replace('<style>.development-banner{box-sizing:border-box;width:100%;padding:10px 18px;text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f2c94c;color:#201a08;border-bottom:2px solid #8a6d00}.development-banner small{display:block;margin-top:3px;font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:none}</style>\n', '')
          s = s.replace('<div class="development-banner" role="status">Development Site<small>This is an experimental build. Features and data may change and may not match the published v1 site.</small></div>\n', '')
          s = s.replace('<p class="selection-version">Development Build</p>', '<p class="selection-version">Live</p>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate promoted JavaScript
        run: |
          node --check dev_startup_bundle.js
          node --check dev_army_bundle.js
          node --check dev_account_bundle.js
          node --check dev_campaign_bundle.js

      - name: Commit LIVE promotion
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "LIVE already matches DEV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote current DEV build to LIVE"
          git push origin HEAD:main
