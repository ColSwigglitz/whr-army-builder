name: Beastmen Abomination smoke test

on:
  pull_request:
    branches: [main]

jobs:
  test-beastmen-abomination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser test Beastmen availability
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle'});
            await page.locator('[data-army-id="chaos_beastmen"]').click();
            await page.waitForTimeout(400);
            const result = await page.evaluate(() => {
              const visible = () => [...document.querySelectorAll('.unit-choice')].some(el => /Chaos Abomination/i.test(el.textContent));
              state.armyOptions.chaosDevotions.chaos_beastmen = 'mixed'; renderUnitBrowser();
              const mixed = visible();
              state.armyOptions.chaosDevotions.chaos_beastmen = 'khorne'; renderUnitBrowser();
              const khorne = visible();
              state.armyOptions.chaosDevotions.chaos_beastmen = 'undivided'; renderUnitBrowser();
              const undivided = visible();
              const abom = state.data.faction.warMachines.find(u => /Chaos Abomination/i.test(u.name || ''));
              const entry = createEntry('warMachines', abom);
              const html = renderWarMachineEditor(entry, abom);
              return {
                mixed, khorne, undivided,
                hasIndependent: /Independent Monster/.test(html),
                hasLordMount: /Mount for Chaos Lord/.test(html),
                hasHeroMount: /Mount for Chaos Hero/.test(html),
                hasSorcererMount: /Mount for Chaos Sorcerer Lord/.test(html)
              };
            });
            console.log(JSON.stringify(result));
            if (result.mixed || result.khorne || !result.undivided) throw new Error('Beastmen devotion visibility incorrect');
            if (!result.hasIndependent || result.hasLordMount || result.hasHeroMount || result.hasSorcererMount) throw new Error('Beastmen Abomination must be independent-only');
            if (errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
