name: Chaos Dwarfs smoke test

on:
  pull_request:
    branches: [main]

jobs:
  test-chaos-dwarfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and inspect borrowed Flame Cannon
        run: |
          node --check chaos_dwarfs_payload_loader.js
          node --check chaos_dwarfs_extensions.js
          node - <<'JS'
          const fs = require('fs'), zlib = require('zlib');
          const decode = p => JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync(p,'utf8').trim(),'base64')).toString());
          const dwarfs = decode('data/whr_dwarfs_v0_1.payload');
          const flame = (dwarfs.faction.warMachines || []).find(u => /flame cannon/i.test(u.name || ''));
          console.log('DWARF_FLAME_CANNON=' + JSON.stringify(flame));
          const cd = decode('data/whr_chaos_dwarfs_v0_1.payload');
          console.log(`CHAOS_DWARFS_COUNTS chars=${cd.faction.characters.length} regs=${cd.faction.regiments.length} machines=${cd.faction.warMachines.length} specials=${cd.faction.specialCharacters.length}`);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser test army styles
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
            page.on('dialog', async d => { console.log('DIALOG=' + d.message()); await d.dismiss(); });
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle'});
            await page.locator('[data-army-id="chaos_dwarfs"]').click();
            await page.waitForTimeout(700);
            const result = await page.evaluate(() => {
              const names = () => [...document.querySelectorAll('.unit-choice')].map(x=>x.textContent.trim());
              const has = needle => names().some(n=>n.includes(needle));
              const classic = { blunder:has('Chaos Dwarf Blunderbusses'), earth:has('Earth Shaker'), cross:has('Chaos Dwarf Crossbows'), iron:has('Iron Daemon') };
              const select = document.querySelector('[data-chaos-dwarf-style]');
              if (!select) throw new Error('Army Style selector missing');
              select.value='old_school'; select.dispatchEvent(new Event('change',{bubbles:true}));
              const old = { blunder:has('Chaos Dwarf Blunderbusses'), earth:has('Earth Shaker'), cross:has('Chaos Dwarf Crossbows'), flame:has('Flame Thrower Team'), jug:has('Chaos Dwarf Juggernaut') };
              document.querySelector('[data-chaos-dwarf-style]').value='modern';
              document.querySelector('[data-chaos-dwarf-style]').dispatchEvent(new Event('change',{bubbles:true}));
              const modern = { blunder:has('Chaos Dwarf Blunderbusses'), earth:has('Earth Shaker'), iron:has('Iron Daemon'), fireborn:has("K'daii Fireborn"), orc:has('Orc Slave Warriors'), black:has('Black Orc Slave Warriors') };
              const warrior = state.data.faction.regiments.find(u=>u.id==='chaos_dwarf_warriors');
              const e=createEntry('regiments',warrior); e.size=10; e.optionSelections.fireglaives=true;
              const fireglaiveCost=calculateEntry(e);
              const hell=state.data.faction.warMachines.find(u=>u.id==='hellcannon');
              const h=createEntry('warMachines',hell); h.optionSelections.extra_crew=2;
              const hellCost=calculateEntry(h);
              return { classic, old, modern, fireglaiveCost, hellCost, faction:state.data.faction.name, errors:errors.length };
            });
            console.log(JSON.stringify(result));
            if (!result.classic.blunder || !result.classic.earth || result.classic.cross || result.classic.iron) throw new Error('Classic style filtering incorrect');
            if (result.old.blunder || result.old.earth || !result.old.cross || !result.old.flame || !result.old.jug) throw new Error('Old School filtering incorrect');
            if (!result.modern.blunder || !result.modern.earth || !result.modern.iron || !result.modern.fireborn || result.modern.orc || result.modern.black) throw new Error('Modern filtering incorrect');
            if (Math.abs(result.fireglaiveCost - 140) > .001) throw new Error(`10 Warriors + Fireglaives expected 140, got ${result.fireglaiveCost}`);
            if (Math.abs(result.hellCost - 140) > .001) throw new Error(`Hellcannon +2 crew expected 140, got ${result.hellCost}`);
            if (errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
