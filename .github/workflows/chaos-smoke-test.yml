name: Chaos smoke test

on:
  pull_request:
    branches: [main]

jobs:
  validate-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check chaos_state_guard.js
          node --check chaos_extensions.js
          node --check chaos_final_fixes.js
      - name: Decode and validate Chaos payload
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib
          payload = pathlib.Path('data/whr_chaos_v0_1.payload').read_text().strip()
          data = json.loads(gzip.decompress(base64.b64decode(payload, validate=True)))
          assert data.get('faction', {}).get('id') == 'chaos'
          print('Chaos payload valid')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser smoke test all Chaos army cards
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const ids = ['chaos_warriors','chaos_beastmen','chaos_daemons','chaos_warband','chaos_warhost'];
            let failed = false;
            for (const id of ids) {
              const page = await browser.newPage();
              const errors = [];
              const dialogs = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
              page.on('dialog', async d => { dialogs.push(`${d.type()}: ${d.message()}`); await d.dismiss(); });
              await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle'});
              await page.locator(`[data-army-id="${id}"]`).click();
              await page.waitForTimeout(500);
              const selectionHidden = await page.locator('#armySelectionScreen').evaluate(el => el.hidden);
              const builderHidden = await page.locator('#builderScreen').evaluate(el => el.hidden);
              const choices = await page.locator('.unit-choice').count();
              console.log(`ARMY ${id}: selectionHidden=${selectionHidden} builderHidden=${builderHidden} choices=${choices}`);
              if (dialogs.length) console.log(`DIALOGS ${id}: ${dialogs.join(' | ')}`);
              if (errors.length) console.log(`ERRORS ${id}: ${errors.join(' | ')}`);
              if (!selectionHidden || builderHidden || choices === 0 || dialogs.some(x => /Could not load/i.test(x)) || errors.length) failed = true;
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          JS
