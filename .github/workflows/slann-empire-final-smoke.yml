name: Slann Empire final smoke
on:
  pull_request:
    branches: [main]
jobs:
  final-slann-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check slann_empire_final_fixes.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser completeness regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('dialog',async d=>d.dismiss());
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});await page.locator('[data-army-id="slann_empire"]').click();await page.waitForTimeout(700);
            const r=await page.evaluate(()=>{
              const f=state.data.faction,by=id=>f.regiments.find(u=>u.id===id),ch=id=>f.characters.find(u=>u.id===id),wm=id=>f.warMachines.find(u=>u.id===id);
              const riders=by('slann_totem_cold_one_riders'),re=createEntry('regiments',riders);re.size=5;re.champion.selected=true;re.slannChampionHornedOne=true;
              const venom=by('slann_venom_tribes'),ve=createEntry('regiments',venom);ve.size=7;
              const saurus=by('saurus_warriors'),se=createEntry('regiments',saurus);se.size=5;
              const warlord=ch('slann_warlord'),we=createEntry('characters',warlord);we.mount='cold_one';we.equipmentSelections.armour='light_armour';we.equipmentSelections.shield='shield';
              const swarm=wm('jungle_swarm');state.roster=[createEntry('warMachines',swarm),createEntry('warMachines',swarm)];
              const swarmTotal=calculateArmyTotal(),swarmReg=calculateRegimentPoints();state.roster=[];
              return {riderCost:calculateEntry(re),riderSave:calculatePrintedArmourSave(re,riders),riderPad:rosterPadRow(re).includes("Spawn Master's Horned One"),venomCommand:Boolean(ve.command.standardBearer),venomSkirmishRule:(venom.rules||[]).some(x=>/skirmish/i.test(x)),saurusSave:calculatePrintedArmourSave(se,saurus),warlordSave:calculatePrintedArmourSave(we,warlord),swarmType:swarm.points.type,swarmTotal,swarmReg,fixed:{slaves:by('lobotomised_slaves').fixedEquipment,totem:riders.fixedEquipment,terr:by('terradon_riders').unitMount?.mountId}};
            });
            console.log('FINAL SLANN',JSON.stringify(r));
            if(r.riderCost!==190||r.riderSave!=='3+'||!r.riderPad)throw new Error(`Spawn Master regression ${JSON.stringify(r)}`);
            if(!r.venomCommand||!r.venomSkirmishRule)throw new Error(`Venom Tribe command/skirmish ${JSON.stringify(r)}`);
            if(r.saurusSave!=='4+'||r.warlordSave!=='3+')throw new Error(`Scaly/Cold One save ${JSON.stringify(r)}`);
            if(r.swarmType!=='fixed'||r.swarmTotal!==80||r.swarmReg!==40)throw new Error(`Swarm allocation ${JSON.stringify(r)}`);
            if(!r.fixed.slaves?.includes('shield')||!r.fixed.totem?.includes('light_armour')||r.fixed.terr!=='terradon')throw new Error(`Equipment/mount patch ${JSON.stringify(r.fixed)}`);
            if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
