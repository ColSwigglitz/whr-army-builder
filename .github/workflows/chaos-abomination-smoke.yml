name: Chaos Abomination smoke test

on:
  pull_request:
    branches: [main]

jobs:
  test-abomination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: node --check chaos_abomination.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser test Abomination builder
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle'});
            await page.locator('[data-army-id="chaos_warriors"]').click();
            await page.waitForTimeout(500);

            const result = await page.evaluate(() => {
              const findAbom = () => state.data.faction.warMachines.find(u => String(u.name||'').toLowerCase().includes('chaos abomination'));
              const abom = findAbom();
              if (!abom) throw new Error('Chaos Abomination data entry not found');

              // Mixed Powers must hide it.
              state.armyOptions.chaosDevotions.chaos_warriors = 'mixed';
              renderUnitBrowser();
              const mixedVisible = [...document.querySelectorAll('.unit-choice')].some(el => /Chaos Abomination/i.test(el.textContent));

              // Undivided must show it.
              state.armyOptions.chaosDevotions.chaos_warriors = 'undivided';
              renderUnitBrowser();
              const undividedVisible = [...document.querySelectorAll('.unit-choice')].some(el => /Chaos Abomination/i.test(el.textContent));

              // Create a qualifying Chaos Lord and then the Abomination.
              const lord = state.data.faction.characters.find(u => u.id === 'chaos_lord' || u.name === 'Chaos Lord');
              if (!lord) throw new Error('Chaos Lord not found');
              const lordEntry = createEntry('characters', lord);
              lordEntry.chaosMark = 'undivided';
              state.roster.push(lordEntry);

              const entry = createEntry('warMachines', abom);
              entry.abomination.generalEntryId = lordEntry.id;
              state.roster.push(entry);

              const baseUnridden = calculateEntry(entry);
              entry.abomination.characteristics.A = 2;
              entry.abomination.specialRules.wings = true;
              const exampleUnridden = calculateEntry(entry);
              entry.abomination.role = 'chaos_lord';
              const lordMounted = calculateEntry(entry);
              const editor = renderWarMachineEditor(entry, abom);
              const row = rosterPadRow(entry);

              // Beastmen Undivided should show it; Khorne should not.
              return {
                mixedVisible,
                undividedVisible,
                baseUnridden,
                exampleUnridden,
                lordMounted,
                editorHasBuildWorkshop: /Build-A-Beast Workshop/.test(editor),
                editorHasGeneral: /Undivided army general/.test(editor),
                rosterHasStats: /Chaos Abomination/.test(row) && /Wings/.test(row)
              };
            });

            console.log(JSON.stringify(result));
            if (result.mixedVisible) throw new Error('Abomination visible in Mixed Powers army');
            if (!result.undividedVisible) throw new Error('Abomination hidden in Undivided Warriors army');
            if (Math.abs(result.baseUnridden - 100) > 0.001) throw new Error(`Base unridden expected 100, got ${result.baseUnridden}`);
            if (Math.abs(result.exampleUnridden - 160) > 0.001) throw new Error(`Book example expected 160, got ${result.exampleUnridden}`);
            if (Math.abs(result.lordMounted - 162) > 0.001) throw new Error(`Lord-mounted build expected 162, got ${result.lordMounted}`);
            if (!result.editorHasBuildWorkshop || !result.editorHasGeneral || !result.rosterHasStats) throw new Error('Editor/Roster Pad custom output missing');
            if (errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
