name: Ogre allies audit
on:
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Inspect Ogre allied pools
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage();
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await p.evaluate(async()=>selectArmy('ogre_mercenaries'));await p.waitForTimeout(200);
            const out=await p.evaluate(()=>{
              const f=state.data.faction;
              const groups={};
              for(const tribe of ['common_goblins','forest_goblins','night_goblins','hobgoblins','halflings']){
                groups[tribe]={
                  characters:f.characters.filter(u=>u.ogreAllyTribe===tribe).map(u=>({id:u.id,name:u.name,tags:u.tags,magicItems:u.magicItems,rules:u.rules})),
                  regiments:f.regiments.filter(u=>u.ogreAllyTribe===tribe).map(u=>({id:u.id,name:u.name})),
                  warMachines:f.warMachines.filter(u=>u.ogreAllyTribe===tribe).map(u=>({id:u.id,name:u.name,tags:u.tags}))
                };
              }
              return groups;
            });
            console.log('OGRE_ALLIES_AUDIT',JSON.stringify(out,null,2));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
