name: Ogre allies audit
on:
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Inspect Ogre allied pools
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage();
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await p.evaluate(async()=>selectArmy('ogre_mercenaries'));await p.waitForTimeout(200);
            const out=await p.evaluate(()=>{
              const f=state.data.faction;
              return {
                commonCharacters:f.characters.filter(u=>u.ogreAllyTribe==='common_goblins').map(u=>({id:u.id,name:u.name,mountOptions:u.mountOptions,profileId:u.profileId})),
                commonMachines:f.warMachines.filter(u=>u.ogreAllyTribe==='common_goblins'),
                mounts:state.data.mounts.filter(m=>String(m.id).includes('ogally_orcs_goblins')),
                profiles:state.data.profiles.filter(x=>String(x.id).includes('ogally_orcs_goblins')).map(x=>({id:x.id,name:x.name,stats:x.stats}))
              };
            });
            console.log('OGRE_ALLIES_DETAIL',JSON.stringify(out,null,2));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
