name: Lizardmen option inspect
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_lizardmen_v0_1.payload','utf8').trim(),'base64')));
          for (const id of ['skink_warriors','saurus_temple_guard']) { const u=d.faction.regiments.find(x=>x.id===id); console.log(id,JSON.stringify(u.options)); }
          for (const id of ['stegadon']) { const u=d.faction.warMachines.find(x=>x.id===id); console.log(id,JSON.stringify(u.options)); }
          JS
