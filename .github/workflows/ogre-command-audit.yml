name: Ogre command audit
on:
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Ogre musicians standards and banners
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage();
            const runtime=[];p.on('pageerror',e=>runtime.push(e.message));p.on('console',m=>{if(m.type()==='error')runtime.push(m.text())});
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await p.evaluate(async()=>selectArmy('ogre_mercenaries'));await p.waitForTimeout(150);
            const result=await p.evaluate(()=>{
              const fail=[];
              const ids=['ogre_beastmaster_pack','ogres','ogre_maneaters','ogre_leadbelchers'];
              for(const id of ids){
                const u=state.data.faction.regiments.find(x=>x.id===id);if(!u){fail.push(`missing ${id}`);continue;}
                const e=createEntry('regiments',u),m=getCommandDefinition(u,'musician'),s=getCommandDefinition(u,'standardBearer');
                if(e.command.musician!==true)fail.push(`${id}: musician not free/default`);
                if(e.command.standardBearer!==false)fail.push(`${id}: standard should start unselected`);
                if(Number(m.cost||0)!==0)fail.push(`${id}: musician cost not 0`);
                if(Number(s.cost)!==10)fail.push(`${id}: standard cost not 10`);
                if(u.magicBanner?.allowed!==true)fail.push(`${id}: magic banner not allowed with standard`);
                const base=calculateEntry(e);e.command.standardBearer=true;
                if(calculateEntry(e)!==base+10)fail.push(`${id}: standard does not add 10 pts`);
                const html=renderRegimentEditor(e,u);
                if(!html.includes('Musician'))fail.push(`${id}: musician control absent`);
                if(!html.includes('Standard Bearer'))fail.push(`${id}: standard control absent`);
                if(!html.includes('data-magic-banner'))fail.push(`${id}: magic banner selector absent after standard`);
                if(!html.includes('Flaming Standard'))fail.push(`${id}: common banner absent`);
                if(html.includes('Banner of Gobbo Awesomeness'))fail.push(`${id}: allied Goblin banner leaked into native Ogre pool`);
              }
              const bsb=state.data.faction.characters.find(u=>u.id==='ogre_bsb');
              const bsbItems=getAllowedMagicItems(bsb,'character');
              if(!bsbItems.some(i=>i.category==='magic_banner'))fail.push('Ogre BSB has no magic banners');
              if(bsbItems.some(i=>i.ogreAllySource))fail.push('Ogre BSB sees allied-race magic items');
              const ogres=state.data.faction.regiments.find(u=>u.id==='ogres'), padEntry=createEntry('regiments',ogres);
              padEntry.command.standardBearer=true;
              const pad=rosterPadRow(padEntry);
              if(!pad.includes('Musician'))fail.push('Roster Pad missing default Ogre musician');
              if(!pad.includes('Standard Bearer'))fail.push('Roster Pad missing selected Ogre standard');
              return fail;
            });
            result.push(...runtime.map(x=>`runtime: ${x}`));
            console.log('OGRE_COMMAND_TOTAL',JSON.stringify({failures:result.length}));
            if(result.length)throw new Error('\n'+result.join('\n'));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
