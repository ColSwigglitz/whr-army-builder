name: Special character zero-one smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify all special characters are 0-1
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            const failures=[];
            const armyIds=await page.evaluate(()=>state.armyManifest.armies.filter(a=>a.available).map(a=>a.id));
            let checked=0;
            for(const armyId of armyIds){
              await page.evaluate(async id=>selectArmy(id),armyId);
              await page.waitForTimeout(80);
              const specials=await page.evaluate(()=>state.data?.faction?.specialCharacters?.map(u=>({id:u.id,name:u.name}))||[]);
              for(const special of specials){
                const result=await page.evaluate(({id})=>{
                  state.roster=[];
                  let alerts=[]; const old=window.alert; window.alert=x=>alerts.push(String(x));
                  addUnit('specialCharacters',id);
                  addUnit('specialCharacters',id);
                  window.alert=old;
                  return {count:state.roster.filter(e=>e.sectionKey==='specialCharacters'&&e.unitId===id).length,alerts};
                },special);
                checked++;
                if(result.count!==1) failures.push(`${armyId}: ${special.name} duplicated (${result.count})`);
                if(!result.alerts.some(a=>/only be included once|may only be included once|0-1|once/i.test(a))) failures.push(`${armyId}: ${special.name} duplicate not explained`);
              }
            }
            failures.push(...errors.map(e=>'runtime: '+e));
            console.log('SPECIAL_ZERO_ONE',JSON.stringify({checked,failures:failures.length}));
            if(failures.length) throw new Error('\n'+failures.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
