name: All armies consistency audit
on:
  pull_request:
    branches: [main]
jobs:
  audit-all-armies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check global_consistency_fixes.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser invariant sweep
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const runtime=[];
            page.on('pageerror',e=>runtime.push(`pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')runtime.push(`console: ${m.text()}`)});
            page.on('dialog',async d=>d.dismiss());
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            const armyIds=await page.evaluate(()=>state.armyManifest.armies.filter(a=>a.available).map(a=>a.id));
            const reports=[];
            for(const id of armyIds){
              await page.evaluate(async id=>{await selectArmy(id)},id);
              await page.waitForTimeout(120);
              const report=await page.evaluate(()=>{
                const f=state.data.faction;
                const issues=[];
                const stats={banners:0,characters:0,champions:0,charMounts:0,unitMounts:0,crew:0};
                const allSections=['characters','regiments','warMachines','specialCharacters'];
                const wizard=u=>Boolean(u?.wizard)||(u?.tags||[]).some(t=>['wizard','mage','sorcerer','shaman'].includes(t));
                const legacyMax=(u,c)=>c==='champion'?Number(u?.champion?.magicItemLimit??u?.champion?.magicItems?.limit??u?.champion?.magicItems?.maximum??0):Number(u?.magicItemLimit??u?.magicItems?.limit??u?.magicItems?.maximum??u?.magicItems?.additionalMaximum??0);

                for(const u of f.regiments||[]){
                  const e=createEntry('regiments',u);
                  if(window.whrUnitHasStandardBearer?.(u)){
                    e.command.standardBearer=true;
                    const html=String(renderRegimentEditor(e,u));
                    stats.banners++;
                    if(!html.includes('data-magic-banner'))issues.push(`BANNER_UI ${u.name}`);
                    else {
                      const optionCount=(html.match(/<option value=/g)||[]).length;
                      if(optionCount<2)issues.push(`BANNER_EMPTY ${u.name}`);
                    }
                  }
                  if(u.champion){
                    const expected=legacyMax(u,'champion');
                    if(expected>0){
                      stats.champions++;
                      const got=getMagicMaximum(u,'champion');
                      if(got!==expected)issues.push(`CHAMP_MAX ${u.name} expected ${expected} got ${got}`);
                      const items=getAllowedMagicItems(u,'champion');
                      if(!items.length)issues.push(`CHAMP_ITEMS_EMPTY ${u.name}`);
                      if(!wizard(u)&&items.some(i=>['arcane_item','familiar'].includes(i.category)))issues.push(`CHAMP_ARCANE ${u.name}`);
                    }
                  }
                  if(u.unitMount?.mountId){
                    stats.unitMounts++;
                    if(!String(rosterPadUnitMountRow(e,u)).trim())issues.push(`UNIT_MOUNT_ROW ${u.name} -> ${u.unitMount.mountId}`);
                  }
                }

                for(const section of ['characters','specialCharacters'])for(const u of f[section]||[]){
                  const expected=legacyMax(u,'character');
                  if(expected>0){
                    stats.characters++;
                    const got=getMagicMaximum(u,'character');
                    if(got!==expected)issues.push(`CHAR_MAX ${u.name} expected ${expected} got ${got}`);
                    const e=createEntry(section,u);state.draft=e;
                    const items=getAllowedMagicItems(u,'character');state.draft=null;
                    if(!items.length && !(u.fixedMagicItems||[]).length)issues.push(`CHAR_ITEMS_EMPTY ${u.name}`);
                    if(!wizard(u)&&items.some(i=>['arcane_item','familiar'].includes(i.category)))issues.push(`CHAR_ARCANE ${u.name}`);
                  }
                  for(const m of u.mountOptions||[]){
                    stats.charMounts++;
                    const e=createEntry(section,u);e.mount=m.mountId;
                    const mount=mountById.get(m.mountId);
                    if(!mount)issues.push(`MOUNT_MISSING ${u.name} -> ${m.mountId}`);
                    else if(!mount.profileId)issues.push(`MOUNT_PROFILE_MISSING ${u.name} -> ${m.mountId}`);
                    else if(!String(rosterPadMountRow(e,u)).trim())issues.push(`MOUNT_ROW ${u.name} -> ${m.mountId}`);
                  }
                  const fixed=createEntry(section,u);
                  if(fixed.mount){
                    stats.charMounts++;
                    if(!String(rosterPadMountRow(fixed,u)).trim())issues.push(`FIXED_MOUNT_ROW ${u.name} -> ${fixed.mount}`);
                  }
                }

                for(const u of f.warMachines||[]){
                  const e=createEntry('warMachines',u);
                  const c=resolveWarMachineCrew(e,u);
                  if(c?.profileId&&Number(c.baseCount)>0){
                    stats.crew++;
                    if(!String(rosterPadWarMachineCrewRow(e,u)).trim())issues.push(`CREW_ROW ${u.name}`);
                  }
                  const text=JSON.stringify(u).toLowerCase();
                  if(/crew/.test(text)&&!(c?.profileId)&&!/crewless|no crew/.test(text))issues.push(`CREW_METADATA? ${u.name}`);
                }
                return {id:state.selectedArmyId,name:f.name,stats,issues};
              });
              reports.push(report);
              console.log('ARMY_AUDIT',JSON.stringify(report));
            }
            const allIssues=reports.flatMap(r=>r.issues.map(i=>`${r.name}: ${i}`));
            console.log('AUDIT_SUMMARY',JSON.stringify({armies:reports.length,issues:allIssues.length,runtime}));
            if(runtime.length)console.error(runtime.join('\n'));
            if(allIssues.length){console.error('INVARIANT ISSUES\n'+allIssues.join('\n'));process.exitCode=1;}
            await browser.close();
            if(process.exitCode)process.exit(process.exitCode);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
