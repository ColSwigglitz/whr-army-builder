name: Ko-fi button smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Ko-fi header button
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            for (const viewport of [{width:1440,height:900},{width:390,height:844}]) {
              const page=await browser.newPage({viewport});
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
              await page.evaluate(async()=>selectArmy('empire'));
              await page.waitForTimeout(100);
              const link=page.locator('.kofi-button');
              if(await link.count()!==1) failures.push(`missing button at ${viewport.width}`);
              if((await link.getAttribute('href'))!=='https://ko-fi.com/colswigglitz') failures.push(`wrong href at ${viewport.width}`);
              if(!(await link.isVisible())) failures.push(`not visible at ${viewport.width}`);
              const box=await link.boundingBox();
              if(!box || box.x<0 || box.x+box.width>viewport.width+1) failures.push(`button overflows at ${viewport.width}`);
              await page.close();
            }
            console.log('KOFI_BUTTON',JSON.stringify({failures}));
            if(failures.length) throw new Error(failures.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
