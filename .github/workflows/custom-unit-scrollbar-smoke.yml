name: Custom unit scrollbar smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify custom Add to Army scrollbar
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1656,height:930}});
            const failures=[];
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.evaluate(async()=>selectArmy('empire'));
            await page.waitForTimeout(150);

            const shell=page.locator('.unit-scroll-shell');
            const track=page.locator('.unit-custom-scrollbar');
            const thumb=page.locator('.unit-custom-scrollbar-thumb');
            const list=page.locator('.unit-sections');

            if(await shell.count()!==1) failures.push('custom scrollbar shell missing');
            if(await track.count()!==1) failures.push('custom scrollbar track missing');
            if(await thumb.count()!==1) failures.push('custom scrollbar thumb missing');
            if(!(await track.isVisible())) failures.push('custom scrollbar track not visible');
            if(!(await thumb.isVisible())) failures.push('custom scrollbar thumb not visible');

            const before=await list.evaluate(el=>el.scrollTop);
            await list.evaluate(el=>el.scrollTop=500);
            await page.waitForTimeout(80);
            const after=await list.evaluate(el=>el.scrollTop);
            if(after<=before) failures.push('unit list did not scroll');

            const transform=await thumb.evaluate(el=>getComputedStyle(el).transform);
            if(!transform || transform==='none' || transform==='matrix(1, 0, 0, 1, 0, 0)') failures.push(`thumb did not move with scroll: ${transform}`);

            const trackBox=await track.boundingBox();
            if(!trackBox || trackBox.x < 0 || trackBox.x+trackBox.width > 1656) failures.push('custom scrollbar outside viewport');

            const oldScroll=after;
            if(trackBox){
              await page.mouse.click(trackBox.x+trackBox.width/2, trackBox.y+trackBox.height*0.85);
              await page.waitForTimeout(80);
              const clicked=await list.evaluate(el=>el.scrollTop);
              if(clicked<=oldScroll) failures.push('clicking scrollbar track did not move list');
            }

            failures.push(...errors.map(e=>'runtime: '+e));
            console.log('CUSTOM_UNIT_SCROLLBAR',JSON.stringify({failures}));
            if(failures.length) throw new Error(failures.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
