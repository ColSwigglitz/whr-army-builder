name: Unit scrollbar smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify visible unit scrollbar
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1656,height:930}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.evaluate(async()=>selectArmy('empire'));
            await page.waitForTimeout(100);
            const result=await page.locator('.unit-sections').evaluate(el=>{
              const cs=getComputedStyle(el);
              return {
                overflowY:cs.overflowY,
                scrollbarGutter:cs.scrollbarGutter,
                scrollbarColor:cs.scrollbarColor,
                scrollHeight:el.scrollHeight,
                clientHeight:el.clientHeight
              };
            });
            const failures=[];
            if(result.overflowY!=='scroll') failures.push(`overflowY=${result.overflowY}`);
            if(!String(result.scrollbarGutter).includes('stable')) failures.push(`scrollbarGutter=${result.scrollbarGutter}`);
            if(result.scrollHeight<=result.clientHeight) failures.push('unit list is not actually overflowing at Chromebook viewport');
            failures.push(...errors.map(e=>'runtime: '+e));
            console.log('UNIT_SCROLLBAR',JSON.stringify({result,failures}));
            if(failures.length) throw new Error(failures.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
