name: Wood Elves smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-wood-elves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and payload
        run: |
          node --check wood_elves_loader.js
          node --check wood_elves_extensions.js
          node --check wood_elves_final_fixes.js
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_wood_elves_v0_1.payload','utf8').trim(),'base64')));
          console.log(`WOOD_ELVES chars=${d.faction.characters.length} regs=${d.faction.regiments.length} machines=${d.faction.warMachines.length} specials=${d.faction.specialCharacters.length}`);
          if(d.faction.characters.length!==11 || d.faction.regiments.length!==17 || d.faction.warMachines.length!==3 || d.faction.specialCharacters.length!==12) process.exit(1);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true}),page=await browser.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('dialog',async d=>{await d.accept()});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.locator('[data-army-id="wood_elves"]').click();await page.waitForTimeout(900);
            const classic=await page.evaluate(()=>{
              const find=(s,id)=>state.data.faction[s].find(u=>u.id===id);
              const warriors=find('regiments','wood_elf_warriors'), w=createEntry('regiments',warriors);w.size=10;w.optionSelections.spears=true;
              const pack=find('regiments','forest_creatures'), p=createEntry('regiments',pack);p.optionSelections={bears:1,hunting_dogs:1,wild_cats:1,wild_hogs:1,beastmasters:1};
              const ch=find('warMachines','wood_elf_chariot'), c=createEntry('warMachines',ch);c.optionSelections.extra_crew=2;c.optionSelections.scythed_wheels=true;
              state.roster=[c];
              const lord=find('characters','wood_elf_warlord');state.draft=createEntry('characters',lord);const lordItems=getAllowedMagicItems(lord,'character');
              const mage=find('characters','mage');state.draft=createEntry('characters',mage);const mageItems=getAllowedMagicItems(mage,'character');
              const browser=[...document.querySelectorAll('.unit-choice-name')].map(x=>x.textContent.trim());
              return {faction:state.data.faction.name,warriors:calculateEntry(w),pack:calculateEntry(p),chariot:calculateEntry(c),regpts:calculateRegimentPoints(),hasWarriors:browser.includes('Wood Elf Warriors'),hasZoat:browser.includes('Zoat Warriors'),hasEternal:browser.includes('Wood Elf Eternal Guard'),bow:lordItems.some(i=>i.id==='bow_loren'),antlerLord:lordItems.some(i=>i.id==='antler_totem'),antlerMage:mageItems.some(i=>i.id==='antler_totem'),pad:rosterPadRow(p).includes('Hunting Dogs')};
            });
            console.log('CLASSIC',JSON.stringify(classic));
            if(classic.faction!=='Wood Elves'||classic.warriors!==75||classic.pack!==54||classic.chariot!==100||classic.regpts!==60||!classic.hasWarriors||!classic.hasZoat||classic.hasEternal||!classic.bow||classic.antlerLord||!classic.antlerMage||!classic.pad)throw new Error('Classic Wood Elf regression failed');
            const savage=await page.evaluate(()=>{
              state.roster=[];state.armyOptions.woodElfStyle='savage';renderUnitBrowser();renderArmy();
              const find=(s,id)=>state.data.faction[s].find(u=>u.id===id);
              const names=[...document.querySelectorAll('.unit-choice-name')].map(x=>x.textContent.trim());
              const kin=find('regiments','tree_kin'), k=createEntry('regiments',kin);
              const lord=find('characters','wood_elf_warlord'), l=createEntry('characters',lord);l.mount='stag';
              const ancient=find('characters','treeman_ancient'), a=createEntry('characters',ancient);a.woodElfSprites=['sprite_luminescents'];
              const d=find('regiments','dryads'), de=createEntry('regiments',d);
              return {hasWarriors:names.includes('Wood Elf Warriors'),hasZoat:names.includes('Zoat Warriors'),hasEternal:names.includes('Wood Elf Eternal Guard'),hasAncient:names.includes('Treeman Ancient'),kinSize:k.size,kin:calculateEntry(k),stag:calculateEntry(l),ancient:calculateEntry(a),dryad:describeEntry(de)};
            });
            console.log('SAVAGE',JSON.stringify(savage));
            if(savage.hasWarriors||savage.hasZoat||!savage.hasEternal||!savage.hasAncient||savage.kinSize!==3||savage.kin!==135||savage.stag!==157||savage.ancient!==260||!savage.dryad.includes('no Aspects'))throw new Error('Savage Wood Elf regression failed');
            if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
