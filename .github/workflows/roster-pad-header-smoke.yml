name: Roster Pad header smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Roster Pad controls do not overlap army name
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for (const width of [1280, 1024]) {
              const page=await browser.newPage({viewport:{width,height:800}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
              await page.evaluate(async()=>{
                await selectArmy('empire');
                const first=state.data.faction.regiments[0];
                addUnit('regiments', first.id);
              });
              await page.fill('#rosterName','The Extremely Long Imperial Army Name Used To Test Header Layout');
              const popupPromise=page.waitForEvent('popup');
              await page.click('#printRosterBtn');
              const popup=await popupPromise;
              await popup.waitForLoadState('domcontentloaded');
              await popup.waitForTimeout(50);
              const result=await popup.evaluate(()=>{
                const controls=document.querySelector('.print-controls').getBoundingClientRect();
                const army=document.querySelector('.army-name-box').getBoundingClientRect();
                const overlap=!(controls.right<=army.left || controls.left>=army.right || controls.bottom<=army.top || controls.top>=army.bottom);
                return {overlap,position:getComputedStyle(document.querySelector('.print-controls')).position};
              });
              console.log('ROSTER_PAD_HEADER',width,JSON.stringify(result));
              if(result.overlap) throw new Error(`Print controls overlap army name at ${width}px`);
              if(result.position==='fixed' || result.position==='absolute') throw new Error(`Print controls still overlay at ${width}px`);
              if(errors.length) throw new Error(errors.join('\n'));
              await popup.close();
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
