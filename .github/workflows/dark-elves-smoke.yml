name: Dark Elves smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-dark-elves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and payload
        run: |
          node --check dark_elves_loader.js
          node --check dark_elves_extensions.js
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_dark_elves_v0_1.payload','utf8').trim(),'base64')));
          console.log(`DARK_ELVES chars=${d.faction.characters.length} regs=${d.faction.regiments.length} machines=${d.faction.warMachines.length} specials=${d.faction.specialCharacters.length}`);
          if(d.faction.characters.length!==9 || d.faction.regiments.length!==10 || d.faction.warMachines.length!==5 || d.faction.specialCharacters.length!==8) process.exit(1);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[], dialogs=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('dialog',async d=>{dialogs.push(d.message());await d.dismiss()});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.locator('[data-army-id="dark_elves"]').click();
            await page.waitForTimeout(900);
            const result=await page.evaluate(()=>{
              const find=(section,id)=>state.data.faction[section].find(u=>u.id===id);
              const warrior=find('regiments','elven_warriors');
              const w=createEntry('regiments',warrior); w.size=20; w.optionSelections.spears=true;
              const cold=find('regiments','cold_one_riders'); const c=createEntry('regiments',cold); c.size=5;
              const hydra=find('warMachines','war_hydra');
              const chariot=find('warMachines','cold_one_chariot');
              const bolt=find('warMachines','repeating_bolt_thrower'); const b=createEntry('warMachines',bolt); b.optionSelections.extra_crew=2; b.optionSelections.crew_light_armour=true;
              const pack=find('regiments','beastmaster_pack'); const p=createEntry('regiments',pack);
              const pChaos=calculateEntry(p); p.optionSelections.hound_type='warhounds'; p.optionSelections.hounds=9; const pWar=calculateEntry(p);

              const general=find('characters','first_among_equals'); state.draft=createEntry('characters',general);
              const charItems=getAllowedMagicItems(general,'character');
              const sorc=find('characters','sorcerer_lord'); state.draft=createEntry('characters',sorc);
              const sorcItems=getAllowedMagicItems(sorc,'character');

              const darkRiders=find('regiments','dark_riders'); const dr=createEntry('regiments',darkRiders); dr.command.standardBearer=true;
              const riderBannerHtml=renderMagicBannerEditor(dr,darkRiders);
              const warriorsBannerEntry=createEntry('regiments',warrior); warriorsBannerEntry.command.standardBearer=true;
              const warriorsBannerHtml=renderMagicBannerEditor(warriorsBannerEntry,warrior);

              state.roster=[];
              const wr=createEntry('regiments',warrior); wr.size=20; state.roster.push(wr);
              const assassin=find('characters','assassin'); const a=createEntry('characters',assassin); a.hiddenInRegimentId=wr.id; state.roster.push(a);
              const regimentPoints=calculateRegimentPoints();

              const padBolt=rosterPadRow(b);
              const padPack=rosterPadRow(p);
              const choices=document.querySelectorAll('.unit-choice').length;
              return {
                faction:state.data.faction.name, choices,
                warriors:calculateEntry(w), cold:calculateEntry(c), hydra:calculateEntry(createEntry('warMachines',hydra)), chariot:calculateEntry(createEntry('warMachines',chariot)), bolt:calculateEntry(b),
                pChaos,pWar,regimentPoints,
                hasDarkSword:charItems.some(i=>i.id==='dark_sword'), hasArcane:sorcItems.some(i=>i.id==='tome_furion'),
                riderExpert:riderBannerHtml.includes('Expert Rider Banner'), riderBlood:riderBannerHtml.includes('Blood Banner'), normalExpert:warriorsBannerHtml.includes('Expert Rider Banner'), normalNagarythe:warriorsBannerHtml.includes('Banner of Nagarythe'),
                boltCrew:/Elven Warrior Crew/.test(padBolt), packProfiles:/Warhounds/.test(padPack)&&/Dark Elf Beastmasters/.test(padPack)
              };
            });
            console.log(JSON.stringify(result));
            if(result.faction!=='Dark Elves'||result.choices<20) throw new Error('Dark Elf army did not load correctly');
            if(result.warriors!==150||result.cold!==135||result.hydra!==200||result.chariot!==66||result.bolt!==92) throw new Error('Dark Elf unit pricing regression');
            if(result.pChaos!==50||result.pWar!==50) throw new Error('Beastmaster pack pricing regression');
            if(result.regimentPoints!==200) throw new Error(`First Assassin should count toward Regiments: got ${result.regimentPoints}`);
            if(!result.hasDarkSword||!result.hasArcane) throw new Error('Dark Elf magic item pool regression');
            if(!result.riderExpert||result.riderBlood||result.normalExpert||result.normalNagarythe) throw new Error('Dark Elf banner restriction regression');
            if(!result.boltCrew||!result.packProfiles) throw new Error('Roster Pad profile regression');
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
