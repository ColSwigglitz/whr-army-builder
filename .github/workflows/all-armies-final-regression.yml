name: All armies final regression
on:
  pull_request:
    branches: [main]
jobs:
  test-all-armies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check global_consistency_fixes.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Sweep every army
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();const runtime=[];
            page.on('pageerror',e=>runtime.push(e.message));page.on('console',m=>{if(m.type()==='error')runtime.push(m.text())});page.on('dialog',async d=>d.dismiss());
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            const ids=await page.evaluate(()=>state.armyManifest.armies.filter(a=>a.available).map(a=>a.id));
            const failures=[];let checked={armies:0,banners:0,characters:0,champions:0,charMounts:0,unitMounts:0,crew:0};
            for(const id of ids){
              await page.evaluate(async id=>{await selectArmy(id)},id);await page.waitForTimeout(100);
              const r=await page.evaluate(()=>{
                const f=state.data.faction,fail=[];const count={banners:0,characters:0,champions:0,charMounts:0,unitMounts:0,crew:0};
                const wizard=u=>Boolean(u?.wizard)||(u?.tags||[]).some(t=>['wizard','mage','sorcerer','shaman'].includes(t));
                const max=(u,c)=>c==='champion'?Number(u?.champion?.magicItemLimit??u?.champion?.magicItems?.limit??u?.champion?.magicItems?.maximum??0):Number(u?.magicItemLimit??u?.magicItems?.limit??u?.magicItems?.maximum??u?.magicItems?.additionalMaximum??0);
                for(const u of f.regiments||[]){
                  const e=createEntry('regiments',u);
                  if(window.whrUnitHasStandardBearer(u)){
                    e.command.standardBearer=true;const html=String(renderRegimentEditor(e,u));count.banners++;
                    if(!html.includes('data-magic-banner'))fail.push(`magic banner UI missing: ${u.name}`);
                    if((html.match(/<option value=/g)||[]).length<2)fail.push(`magic banner pool empty: ${u.name}`);
                  }
                  const cm=max(u,'champion');if(cm>0){count.champions++;if(getMagicMaximum(u,'champion')!==cm)fail.push(`champion item max ${u.name}`);const items=getAllowedMagicItems(u,'champion');if(!items.length)fail.push(`champion items empty ${u.name}`);if(!wizard(u)&&items.some(i=>['arcane_item','familiar'].includes(i.category)))fail.push(`champion arcane leak ${u.name}`);}
                  if(u.unitMount?.mountId){count.unitMounts++;if(!String(rosterPadUnitMountRow(e,u)).trim())fail.push(`unit mount profile missing ${u.name}`);}
                }
                for(const section of ['characters','specialCharacters'])for(const u of f[section]||[]){
                  const m=max(u,'character');if(m>0){count.characters++;if(getMagicMaximum(u,'character')!==m)fail.push(`character item max ${u.name}`);const e=createEntry(section,u);state.draft=e;const items=getAllowedMagicItems(u,'character');state.draft=null;if(!items.length&&!(u.fixedMagicItems||[]).length)fail.push(`character items empty ${u.name}`);if(!wizard(u)&&items.some(i=>['arcane_item','familiar'].includes(i.category)))fail.push(`character arcane leak ${u.name}`);}
                  for(const mo of u.mountOptions||[]){count.charMounts++;const e=createEntry(section,u);e.mount=mo.mountId;const mt=mountById.get(mo.mountId);if(!mt?.profileId||!String(rosterPadMountRow(e,u)).trim())fail.push(`character mount profile missing ${u.name} -> ${mo.mountId}`);}
                }
                for(const u of f.warMachines||[]){const e=createEntry('warMachines',u),c=resolveWarMachineCrew(e,u);if(c?.profileId&&Number(c.baseCount)>0){count.crew++;if(!String(rosterPadWarMachineCrewRow(e,u)).trim())fail.push(`war machine crew profile missing ${u.name}`);}const txt=JSON.stringify(u).toLowerCase();if(/crew/.test(txt)&&!c?.profileId&&!/crewless|no crew/.test(txt)){const pad=String(rosterPadRow(e)).toLowerCase();if(!/crew|handler/.test(pad))fail.push(`crew metadata/output missing ${u.name}`);}}
                if(f.id==='empire'){const p=f.characters.find(u=>u.name==='Warrior Priest'),e=createEntry('characters',p);e.mount='warrior_priest_chariot';const row=String(rosterPadMountRow(e,p));if(!row.includes('Large Chariot')||!row.includes('Barded Warhorses'))fail.push('Warrior Priest chariot/horse profiles incomplete');}
                return {name:f.name,fail,count};
              });
              checked.armies++;for(const k of Object.keys(r.count))checked[k]+=r.count[k];if(r.fail.length)failures.push(...r.fail.map(x=>`${r.name}: ${x}`));console.log('CHECK',r.name,JSON.stringify(r.count),r.fail.length?'FAIL':'PASS');
            }
            console.log('TOTALS',JSON.stringify(checked));if(runtime.length)failures.push(...runtime.map(x=>`runtime: ${x}`));if(failures.length)throw new Error('\n'+failures.join('\n'));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
