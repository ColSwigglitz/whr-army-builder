name: Dogs of War smoke test
on:
  pull_request:
    branches: [main]
jobs:
  test-dogs-of-war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and payload
        run: |
          node --check dogs_of_war_loader.js
          node --check dogs_of_war_extensions.js
          node --check dogs_of_war_dwarf_runes.js
          node --check dogs_of_war_final_fixes.js
          node --check dogs_of_war_magic_guard.js
          node - <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          const d=JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync('data/whr_dogs_of_war_v0_1.payload','utf8').trim(),'base64')));
          console.log(`DOGS chars=${d.faction.characters.length} regs=${d.faction.regiments.length} machines=${d.faction.warMachines.length} specials=${d.faction.specialCharacters.length}`);
          if(d.faction.characters.length!==8 || d.faction.regiments.length!==13 || d.faction.warMachines.length!==6 || d.faction.specialCharacters.length!==7) process.exit(1);
          JS
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Browser regression
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('dialog',async d=>{await d.dismiss()});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.locator('[data-army-id="dogs_of_war"]').click();
            await page.waitForTimeout(900);

            const result=await page.evaluate(()=>{
              const find=(s,id)=>state.data.faction[s].find(u=>u.id===id);
              const foot=find('regiments','human_foot_soldiers'), f=createEntry('regiments',foot);f.size=10;
              const fspear=createEntry('regiments',foot);fspear.size=10;fspear.optionSelections.melee_weapon='spear';
              const knights=find('regiments','human_knights'), k=createEntry('regiments',knights);k.size=5;
              const kb=createEntry('regiments',knights);kb.size=5;kb.optionSelections.barding=true;
              const ogres=find('regiments','ogre_mercenaries'), o=createEntry('regiments',ogres);o.size=3;
              const oh=createEntry('regiments',ogres);oh.size=3;oh.optionSelections.heavy_armour=true;
              const sea=find('regiments','sea_elf_mercenaries'), s=createEntry('regiments',sea);s.size=5;
              const sl=createEntry('regiments',sea);sl.size=5;sl.optionSelections.longbow=true;
              const cav=find('regiments','human_cavalry_retainers'), c=createEntry('regiments',cav);c.size=6;c.optionSelections.armour='heavy_armour';c.command.standardBearer=true;
              const hot=find('warMachines','halfling_hot_pot'), h=createEntry('warMachines',hot);h.optionSelections.extra_crew=2;
              const ves=find('regiments','vesperos_vendetta'), v=createEntry('regiments',ves);v.optionSelections.extra_duelists=2;
              const ogl=find('regiments','oglah_khans_wolfboyz'), g=createEntry('regiments',ogl);g.optionSelections.extra_wolfboyz=1;
              const cursed=find('regiments','cursed_company'), cc=createEntry('regiments',cursed);cc.optionSelections.extra_skeletons=5;
              const norse=find('regiments','norse_huscarls'), n=createEntry('regiments',norse);n.size=10;n.dowExtraChampions=2;
              const myrdas=find('specialCharacters','myrdas'), my=createEntry('specialCharacters',myrdas);my.optionSelections.extra_bodyguards=2;
              const humanItems=getAllowedMagicItems(foot,'champion');
              const knightItems=getAllowedMagicItems(knights,'champion');
              const seaItems=getAllowedMagicItems(sea,'champion');
              const norseItems=getAllowedMagicItems(norse,'champion');
              const fb=createEntry('regiments',foot);fb.command.standardBearer=true;
              const nb=createEntry('regiments',norse);nb.command.standardBearer=true;
              const humanBanners=renderMagicBannerEditor(fb,foot);
              const norseBanners=renderMagicBannerEditor(nb,norse);
              const asarnil=find('specialCharacters','asarnil'), a=createEntry('specialCharacters',asarnil);
              const lord=find('characters','human_mercenary_lord');
              const paymaster=find('characters','human_paymaster');
              const dwarf=find('regiments','dwarf_mercenary_warriors'), de=createEntry('regiments',dwarf);de.champion.selected=true;de.command.standardBearer=true;
              const dwarfEditor=renderRegimentEditor(de,dwarf);
              return {
                faction:state.data.faction.name,choices:document.querySelectorAll('.unit-choice-name').length,
                costs:{foot:calculateEntry(f),fspear:calculateEntry(fspear),knights:calculateEntry(k),kb:calculateEntry(kb),ogres:calculateEntry(o),oh:calculateEntry(oh),sea:calculateEntry(s),sl:calculateEntry(sl),cav:calculateEntry(c),hot:calculateEntry(h),ves:calculateEntry(v),ogl:calculateEntry(g),cursed:calculateEntry(cc),norse:calculateEntry(n),myrdas:calculateEntry(my)},
                magic:{
                  humanEmpire:humanItems.some(i=>i.dowSourceFaction==='empire'),humanKislev:humanItems.some(i=>i.dowSourceFaction==='kislev'),humanVirtue:humanItems.some(i=>i.isVirtue),humanGeneralOnly:humanItems.some(i=>i.generalOnly||i.lordOnly||i.wizardOnly),
                  knightBretonnia:knightItems.some(i=>i.dowSourceFaction==='bretonnia'),knightVirtue:knightItems.some(i=>i.isVirtue),seaHigh:seaItems.some(i=>i.dowSourceFaction==='high_elves'),
                  norsePool:norseItems.some(i=>i.dowSourceFaction==='norse'&&i.originalId==='dainsleif'),norseRestricted:norseItems.some(i=>['andvares_gift','gandstaff'].includes(i.originalId)),
                  humanBannerKislev:humanBanners.includes('Banner of Ursus'),norseBanner:norseBanners.includes('Raven Banner')
                },
                asarnilMount:a.mount,asarnilColour:a.optionSelections.dragon_colour,
                lordMounts:(lord.mountOptions||[]).map(m=>m.mountId),paymasterMounts:(paymaster.mountOptions||[]).map(m=>m.mountId),
                dwarfRunes:!!state.data.faction.systems.dwarfRunes,dwarfRuneEditor:dwarfEditor.includes('Champion Runic Weapon')&&dwarfEditor.includes('Runic Standard'),
                padV:rosterPadRow(v).includes('Vespero'),padC:rosterPadRow(cc).includes('Richter Kreugar')
              };
            });
            console.log('BASE',JSON.stringify(result));
            if(result.faction!=='Dogs of War'||result.choices<25) throw new Error('Dogs of War did not load');
            const expected={foot:50,fspear:60,knights:100,kb:115,ogres:72,oh:84,sea:50,sl:60,cav:78,hot:60,ves:150,ogl:162,cursed:180,norse:136,myrdas:216};
            for(const [key,value] of Object.entries(expected)) if(result.costs[key]!==value) throw new Error(`${key} expected ${value}, got ${result.costs[key]}`);
            const m=result.magic;
            if(!m.humanEmpire||!m.humanKislev||m.humanVirtue||m.humanGeneralOnly||!m.knightBretonnia||!m.knightVirtue||!m.seaHigh||!m.norsePool||m.norseRestricted||!m.humanBannerKislev||!m.norseBanner) throw new Error(`Mercenary magic pools failed: ${JSON.stringify(m)}`);
            if(result.asarnilMount!=='high_elf_dragon'||result.asarnilColour!=='red') throw new Error('Asarnil fixed mount/options failed');
            if(!result.lordMounts.includes('barded_warhorse')||result.paymasterMounts.length) throw new Error('Character mount restrictions failed');
            if(!result.dwarfRunes||!result.dwarfRuneEditor) throw new Error('Dwarf mercenary rune access failed');
            if(!result.padV||!result.padC) throw new Error('RoR Roster Pad profiles failed');

            const construction=await page.evaluate(()=>{
              state.roster=[];
              const count=id=>state.roster.filter(e=>e.unitId===id).length;
              addUnit('regiments','halfling_bowmen'); const blockedNoMainstay=count('halfling_bowmen')===0;
              addUnit('characters','ogre_mercenary_hero'); const ogreHeroBlocked=count('ogre_mercenary_hero')===0;
              addUnit('warMachines','halfling_hot_pot'); const hotBlocked=count('halfling_hot_pot')===0;
              addUnit('regiments','human_foot_soldiers');
              addUnit('regiments','halfling_bowmen'); addUnit('regiments','halfling_bowmen'); const oneMainstayCaps=count('halfling_bowmen')===1;
              addUnit('regiments','human_knights'); addUnit('regiments','halfling_bowmen'); const twoMainstayAllows=count('halfling_bowmen')===2;
              addUnit('regiments','ogre_mercenaries'); addUnit('characters','ogre_mercenary_hero'); const ogreHeroAllowed=count('ogre_mercenary_hero')===1;
              addUnit('warMachines','halfling_hot_pot'); const hotAllowed=count('halfling_hot_pot')===1;
              addUnit('characters','human_paymaster'); addUnit('specialCharacters','myrdas'); const onePaymaster=count('human_paymaster')+count('myrdas')===1;
              state.roster=[]; addUnit('regiments','vesperos_vendetta'); addUnit('regiments','halfling_bowmen'); const vesperoMainstay=count('halfling_bowmen')===1;
              return {blockedNoMainstay,ogreHeroBlocked,hotBlocked,oneMainstayCaps,twoMainstayAllows,ogreHeroAllowed,hotAllowed,onePaymaster,vesperoMainstay};
            });
            console.log('CONSTRUCTION',JSON.stringify(construction));
            if(Object.values(construction).some(v=>!v)) throw new Error(`Construction rule regression: ${JSON.stringify(construction)}`);
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
