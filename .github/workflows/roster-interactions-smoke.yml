name: Roster interactions smoke
on:
  pull_request:
    branches: [main]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Test copy and drag ordering
        run: |
          python3 -m http.server 8000 >/tmp/whr-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            await page.evaluate(async()=>selectArmy('empire'));
            await page.waitForTimeout(250);

            const result=await page.evaluate(()=>{
              const fail=[]; const expect=(ok,msg)=>{if(!ok)fail.push(msg)};
              const regiments=state.data.faction.regiments;
              expect(regiments.length>=3,'Empire needs at least three test regiments');
              const [u1,u2,u3]=regiments;
              addUnit('regiments',u1.id); addUnit('regiments',u2.id); addUnit('regiments',u3.id);
              const original=state.roster.filter(e=>e.sectionKey==='regiments')[0];
              original.size=Math.max(original.size,12);
              original.command.musician=true;
              original.command.standardBearer=true;
              original.champion.selected=Boolean(u1.champion);
              original.optionSelections={...original.optionSelections,test_marker:3};
              original.magicBanner='test_unique_banner';
              if(original.champion) original.champion.magicItems=['test_unique_item'];
              renderArmy();

              expect(document.querySelectorAll('.roster-section .duplicate-button').length===3,'Copy buttons missing');
              expect(document.querySelectorAll('.roster-section .roster-drag-handle').length===3,'Drag handles missing');

              const before=state.roster.length;
              whrDuplicateRegiment(original.id);
              expect(state.roster.length===before+1,'Duplicate did not add one regiment');
              const regs=state.roster.filter(e=>e.sectionKey==='regiments');
              const originalIndex=regs.findIndex(e=>e.id===original.id);
              const copy=regs[originalIndex+1];
              expect(copy && copy.unitId===original.unitId,'Copy not inserted after original');
              expect(copy.id!==original.id,'Copy reused original id');
              expect(copy.size===original.size,'Unit size not copied');
              expect(copy.command.musician===original.command.musician,'Command not copied');
              expect(copy.optionSelections.test_marker===3,'Option selections not copied');
              expect(copy.champion.selected===original.champion.selected,'Champion selection not copied');
              expect(copy.magicBanner===null,'Unique magic banner was incorrectly duplicated');
              expect((copy.champion.magicItems||[]).length===0,'Champion magic item was incorrectly duplicated');

              const current=state.roster.filter(e=>e.sectionKey==='regiments');
              const dragged=current[current.length-1], target=current[0];
              whrReorderRosterEntry(dragged.id,target.id,true);
              const reordered=state.roster.filter(e=>e.sectionKey==='regiments');
              expect(reordered[0].id===dragged.id,'Underlying roster order did not change');
              const domIds=[...document.querySelectorAll('.roster-section .roster-card[data-section-key="regiments"]')].map(x=>x.dataset.entryId);
              expect(domIds[0]===dragged.id,'Rendered regiment order did not change');
              const saved=makeRosterSnapshot().roster.filter(e=>e.sectionKey==='regiments');
              expect(saved[0].id===dragged.id,'Saved roster snapshot did not preserve order');

              return fail;
            });

            // Exercise real HTML5 drag/drop rather than only the test hook.
            const handles=page.locator('.roster-drag-handle');
            if(await handles.count()>=2){
              const cards=page.locator('.roster-card[data-section-key="regiments"]');
              const firstId=await cards.nth(0).getAttribute('data-entry-id');
              const lastHandle=handles.nth((await handles.count())-1);
              const firstCard=cards.nth(0);
              await lastHandle.dragTo(firstCard);
              await page.waitForTimeout(150);
              const newFirst=await page.locator('.roster-card[data-section-key="regiments"]').nth(0).getAttribute('data-entry-id');
              if(newFirst===firstId) result.push('HTML5 drag/drop did not reorder regiment cards');
            }

            result.push(...errors.map(e=>'runtime: '+e));
            console.log('ROSTER_INTERACTIONS',JSON.stringify({failures:result.length,details:result}));
            if(result.length) throw new Error('\n'+result.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
