name: Deploy develop to dev site

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run site integrity regression
        run: node tests/site_integrity.mjs

      - name: Run WHR v1 release regression
        run: node tests/v1_release_regression.mjs

      - name: Run General system regression
        run: node tests/general_system_regression.mjs

      - name: Run campaign security regression
        run: node tests/campaign_security_regression.mjs

      - name: Prepare deployment copy
        run: |
          rm -rf .deploy
          mkdir .deploy
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'CNAME' \
            ./ .deploy/
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -E -i "s#global_release_finalize\\.js\\?v=[^\"]+#global_release_finalize.js?v=${SHORT_SHA}#g" .deploy/index.html
          touch .deploy/.nojekyll

      - name: Push to development deployment repository
        env:
          GH_TOKEN: ${{ secrets.DEV_DEPLOY_TOKEN }}
        run: |
          cd .deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy develop ${GITHUB_SHA}"
          git branch -M main
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/ColSwigglitz/whr-army-builder-dev.git
          git push --force origin main
